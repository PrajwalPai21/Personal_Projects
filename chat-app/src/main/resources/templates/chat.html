<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real Time Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
</head>
<body>
<!--  <h1>Real-Time Chat App</h1>-->
<!--<button type="button" class="btn btn-primary">Button</button>-->
<div class="container mt-4">
    <h1 class="text-center">Real Time Chat Application</h1>
    <div id="chat-area"
         class="border rounded p-3 mb-3"
         style= "height: 300px; overflow-y: auto;">
    </div>
    <div class="input-group mb-3">
        <input id="senderInput"
               type="text" class="form-control"
               placeholder="Enter your name..." aria-label="Recipient"/>
    </div>

    <div class="input-group mb-3">
        <input id="messageInput"
               type="text" class="form-control"
               placeholder="Type a message.." aria-label="Recipient"/>

        <div id="input-group-append">
            <button id="sendMessageBtn" class="btn btn-primary">Send</button>

        </div>
    </div>

</div>
</body>
<script>
    function setConnected(connected){
        document.getElementById('sendMessageBtn').disabled = !connected;
    }
<!--    helps establish web socket connection using stomp-->

    function connectFunc(){
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame){
            setConnected(true); //only used when connection is established
            stompClient.subscribe('/topic/messages',function (message){
                showMessageFunc(JSON.parse(message.body));   //show any messages
            });
        });
        }
        function showMessageFunc(message){
            var chat = document.getElementById('chat-area');
            var messageElement = document.createElement('div');
            messageElement.textContent = message.sender+ ": "+ message.content; //refer to model
            messageElement.class = 'border-bottom mb-1';
            chat.appendChild(messageElement);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessageFunc(){
            var sender = document.getElementById('senderInput').value;
            var content = document.getElementById('messageInput').value;
        //     sending to backend , controller method

            var chatMessage = {
                sender: sender,
                content: content,
            }
            stompClient.send("/app/sendMessage",{}, JSON.stringify(chatMessage));
            document.getElementById('messageInput').value = " ";
    }
    document.getElementById('sendMessageBtn').onclick = sendMessageFunc;
    window.onload = connectFunc();
</script>
</html>
